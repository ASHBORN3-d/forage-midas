<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Internship Studio: CSS Tables!</title>

	<style>
		
		.main-head {
			background-color: crimson;
      text-align: center;
			color: white;
			font-size: 30px;
			max-width: 750px;
			margin: 20px auto 0 auto;
			padding: 30px;
		}

    
    .table-content {
      border-collapse: collapse;
      margin: 25px 0;
      font-size: 0.9em; 
      minimum-width: 400px;
      border-radius: 5px 5px 0 0;
      overflow: hidden;
      margin: 20px auto 0 auto;
			padding: 30px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    }

    tr {
      cursor: pointer;
    }

    tr:hover {
      background-color: lightgray;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    }

    .table-content thead tr {
      background-color: seagreen;
      color: white;
      text-align: left;
      font-weight: bold;
    }

    .table-content th,
    .table-content td {
      padding: 12px 15px;
    }

    .table-content tbody tr {
      border-bottom: 1px solid lightslategray;
    }

    .table-content tbody tr:nth-of-type(even) {
      background-color: lightgray;
    }

    .table-content tbody tr:last-of-type {
      border-bottom: 2px solid seagreen;
    }

    .table-content tbody tr.active-row {
      font-weight: bold;
      color: seagreen;
    }

    /*Media Query */
    @media only screen and (max-width: 750px){
      table {
        width: 90%;
      }
    }
	</style>
</head>

<body>

	<h2 class="main-head">CSS Properties for Tables:</h2>

	<table class = "table-content">
		<thead>
			<tr>
				<th>Sr. No.</th>
				<th>Name</th>
				<th>Class</th>
				<th>Marks</th>
			</tr>
		</thead>

    <tr>
				<td>01</td>
				<td>Yudhishthira</td>
				<td>BE</td>
				<td>95%</td>
			</tr>

      <tr class = "active-row">
				<td>02</td>
				<td>Bhima</td>
				<td>TE</td>
				<td>92%</td>
			</tr>

      <tr>
				<td>03</td>
				<td>Arjuna</td>
				<td>SE</td>
				<td>90%</td>
			</tr>

      <tr>
				<td>04</td>
				<td>Nakula</td>
				<td>SE</td>
				<td>85%</td>
			</tr>

      <tr class = "active-row">
				<td>05</td>
				<td>Sahadeva</td>
				<td>FE</td>
				<td>85%</td>
			</tr>

      
	</table>

</body>

</html>
