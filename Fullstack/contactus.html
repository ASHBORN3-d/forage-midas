<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="Contactus.css">
  <title>Contact Us!</title>
</head>
<body>
  <div class="navbar">
  <a href="CSSResponsive.html">Home</a>
  <a href="contactus.html">Contact Us</a>
</div>
  <header id="showcase">
    <h1>Registration Form</h1>
  </header>
  <!-- Navigation Bar -->

  <div id = "content" class="container">
  <form action="/action_page.php">
    <div class="row">
      <div class="col-25">
        <label for="uname">Name</label>
      </div>
      <div class="col-75">
        <input type="text" name="username" placeholder="Your Name..">
      </div>
    </div>
    <div class="row">
      <div class="col-25">
        <label for="email">Email</label>
      </div>
      <div class="col-75">
        <input type="email" name="emailid" placeholder="Your EmailId..">
      </div>
    </div>
    <div class="row">
      <div class="col-25">
        <label for="email">Gender</label>
      </div>
      <div class="col-75">
        <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label><br>
      </div>
    </div>
    <div class="row">
      <div class="col-25">
        <label for="country">Select the Program:</label>
      </div>
      <div class="col-75">
        <select name="program">
          <option value="Select Internship*">Select Internship</option>
          <option value="Machine Learning">Machine Learning</option>
          <option value="Excel Automation">Excel Automation</option>
          <option value="Website Designing">Website Designing</option>
          <option value="Digital Marketing">Digital Marketing</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col-25">
        <label for="subject">Subject</label>
      </div>
      <div class="col-75">
        <textarea id="subject" name="subject" placeholder="Write something.." style="height:100px"></textarea>
      </div>
    </div>
    <div class="row">
      <a href="#" class="btn">Submit</a>
    </div>
  </form>
</div>
</body>
</html>
